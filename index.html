/* ---------------- ses (kodla üretilir, dosya yok) ---------------- */
let actx = null, muted = false, noise = null;
function audio(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
    // 1 sn'lik beyaz gürültü, sıçrama ve fırlatma sesleri bundan türetilir
    noise = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noise.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  if(actx.state === 'suspended') actx.resume();
  return muted ? null : actx;
}
// gürültü tabanlı vuruş: sıçrama, fırlatma
function burst(dur, f0, f1, vol, q){
  const a = audio(); if(!a) return;
  const src = a.createBufferSource(); src.buffer = noise; src.loop = true;
  const flt = a.createBiquadFilter(); flt.type='bandpass'; flt.Q = q||1.2;
  flt.frequency.setValueAtTime(f0, a.currentTime);
  flt.frequency.exponentialRampToValueAtTime(Math.max(40,f1), a.currentTime+dur);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
  src.connect(flt).connect(g).connect(a.destination);
  src.start(); src.stop(a.currentTime+dur+0.02);
}
// tonlu nota: gerdirme tıkırtısı, bitiş ezgisi
function tone(freq, dur, vol, type, delay){
  const a = audio(); if(!a) return;
  const t = a.currentTime + (delay||0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t+dur+0.02);
}
// Kendi ses dosyalarını koymak istersen: aşağıdaki her satırı bununla değiştir —
//   const s = new Audio('ses/splat.mp3'); s.volume = 0.6; s.play();
// başka hiçbir yere dokunmana gerek yok, olaylar zaten buraya bağlı.
const sfx = {

  shoot(area){ burst(0.20, 1600, 380, 0.18, 0.9);               // havayı yaran fırlatma
               tone(220+140/Math.sqrt(area), 0.12, 0.06, 'triangle'); },
  splat(area){ const lo = 240/Math.sqrt(area);                  // büyük balon = pes "şpat"

  mix(){ tone(660, 0.09, 0.05, 'sine'); },                       // üst üste boya (renk karıştı)
  win(){ [523,659,784,1047].forEach((f,i)=> tone(f, 0.30, 0.10, 'triangle', i*0.11)); },

           tone(180, 0.09, 0.10, 'square'); },

/* ---------------- renk yardımcıları ---------------- */
function hex2rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rgb2hsl(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let h=0;
  if(d){ if(mx===r) h=((g-b)/d+ (g<b?6:0)); else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; }
  const l=(mx+mn)/2, s = d===0?0: d/(1-Math.abs(2*l-1));
  return [h,s,l];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60)[r,g,b]=[c,x,0]; else if(h<120)[r,g,b]=[x,c,0]; else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c]; else if(h<300)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
// boya karışımı: ton kısa yaydan harmanlanır, üst üste binen katmanlar tonu koyultur
function mixPaint(a, wa, b, wb){
  const A=rgb2hsl(a[0],a[1],a[2]), B=rgb2hsl(b[0],b[1],b[2]);
  const t = wb/(wa+wb);
  let h;
  if(A[1]<0.08 || B[1]<0.08){ h = A[1]<0.08 ? B[0] : A[0]; }   // biri gri/siyah/beyazsa renkli olanın tonu
  else {
    let d = ((B[0]-A[0]+540)%360)-180;
    h = A[0] + d*t;
  }
  const s = A[1]*(1-t) + B[1]*t;
  let l = A[2]*(1-t) + B[2]*t;
  l *= 0.78;                       // katman biriktikçe belirgin koyulaşma (boya/jöle hissi)
  l = Math.max(0.05, l);
  return hsl2rgb(h, Math.min(1,s*1.05), l);
}
/* ---------------- jelly küp dokusu ---------------- */
function shade(c, k){   // k>0 açar, k<0 koyultur
  return k >= 0 ? [c[0]+(255-c[0])*k, c[1]+(255-c[1])*k, c[2]+(255-c[2])*k]
                : [c[0]*(1+k), c[1]*(1+k), c[2]*(1+k)];
}
function rr(g, x, y, w, h, r){
  if(g.roundRect){ g.beginPath(); g.roundRect(x,y,w,h,r); }
  else { g.beginPath(); g.rect(x,y,w,h); }
}
const cubeCache = new Map();
// tek bir 1×1 jöle küpü: eğimli kenarlar + iç jel + parlama. Yan yana dizilince blok olur.
function cubeTex(c, size){
  const S = Math.max(6, Math.round(size));
  const key = (c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+S;
  let t = cubeCache.get(key);
  if(t) return t;
  if(cubeCache.size > 260) cubeCache.clear();
  t = document.createElement('canvas');
  t.width = t.height = S;
  const g = t.getContext('2d');
  const b = S*0.19;
  // taban: en koyu ton (küpün yan yüzleri)
  g.fillStyle = rgbs(shade(c,-0.45));
  rr(g, 0.5, 0.5, S-1, S-1, S*0.16); g.fill();
  // üst yüz — ışık üstten
  g.fillStyle = rgbs(shade(c, 0.5));
  g.beginPath(); g.moveTo(1,1); g.lineTo(S-1,1); g.lineTo(S-b,b); g.lineTo(b,b); g.closePath(); g.fill();
  // sol yüz
  g.fillStyle = rgbs(shade(c, 0.18));
  g.beginPath(); g.moveTo(1,1); g.lineTo(b,b); g.lineTo(b,S-b); g.lineTo(1,S-1); g.closePath(); g.fill();
  // sağ yüz
  g.fillStyle = rgbs(shade(c,-0.22));
  g.beginPath(); g.moveTo(S-1,1); g.lineTo(S-1,S-1); g.lineTo(S-b,S-b); g.lineTo(S-b,b); g.closePath(); g.fill();
  // iç jel gövdesi
  const gr = g.createLinearGradient(0,b,0,S-b);
  gr.addColorStop(0, rgbs(shade(c, 0.22)));
  gr.addColorStop(0.55, rgbs(c));
  gr.addColorStop(1, rgbs(shade(c,-0.18)));
  g.fillStyle = gr;
  rr(g, b, b, S-2*b, S-2*b, (S-2*b)*0.3); g.fill();
  // jöle parlaması
  g.fillStyle = 'rgba(255,255,255,.42)';
  rr(g, b*1.5, b*1.4, (S-2*b)*0.42, (S-2*b)*0.3, S*0.08); g.fill();
  g.fillStyle = 'rgba(255,255,255,.14)';
  rr(g, b*1.5, b*1.4, (S-2*b)*0.72, (S-2*b)*0.62, S*0.1); g.fill();
  // dış hat
  g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = Math.max(1, S*0.035);
  rr(g, 0.5, 0.5, S-1, S-1, S*0.16); g.stroke();
  cubeCache.set(key, t);
  return t;
}
function drawCube(x, y, s, c, alpha){
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.drawImage(cubeTex(c, s), x, y, s, s);
  ctx.globalAlpha = 1;
}

function dist2(a,b){ const dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2]; return Math.sqrt(dr*dr+dg*dg+db*db); }

/* ---------------- bölümler ---------------- */
const PAL = { r:'#e5384a', o:'#f08a2c', y:'#f5cf3d', g:'#4bb85f', b:'#3a7fd5', p:'#8b53c9', k:'#3b3f4a', w:'#ffffff', c:'#45c3c9', m:'#e06aa8', n:'#8a5a2b' };

/* ---------------- durum ---------------- */
const N = 16;
let W, H, cell, gridX, gridY, gridSize, launchX, launchY, wall = 12;
let level = 0, target = [], paint = [], ammo = 0, queue = [], deck = [], matchPct = 0;
let drag = null, flying = null, splats = [], state = 'menu';
let mode = 'paint';          // 'paint' = sapanla balon, 'block' = yapışkan el blok koyar
let hand = null;             // uzayan el animasyonu
let bits = [], shake = 0;   // uçuşan boya damlaları / balon parçaları, ekran sarsıntısı
let shocks = [];            // yerleştirme sarsıntısı: küpler dalga halinde titreşir
let history = [], undoLeft = 3;   // geri alma: yanlış konan blok bölümü çöpe atmasın

function undo(){
  if(!undoLeft || !history.length || flying || hand || state !== 'aim') return;
  const rec = history.pop();
  for(const s of rec.snap)
    paint[s.y][s.x] = s.prev ? { c:s.prev.c, w:s.prev.w, pop:0 } : null;
  queue.unshift(rec.b);                       // blok sıranın başına döner
  while(queue.length > 3) deck.unshift(queue.pop());
  ammo++; undoLeft--;
  computeMatch();
  sfx.bump();
  refreshUndo();
}
function refreshUndo(){
  $('ul').textContent = undoLeft;
  $('undo').disabled = !undoLeft || !history.length || state !== 'aim';
  $('undo').style.display = state === 'menu' ? 'none' : 'block';
}

// yerleştirme noktasından yayılan jöle dalgası: yakındaki küp daha şiddetli sallanır
function jiggle(cx, cy){
  let w = 0;
  for(const s of shocks){
    const d = Math.hypot(cx-s.x, cy-s.y);
    const ph = s.t - d/(cell*24);             // dalga dışa doğru gecikmeyle ulaşır
    if(ph <= 0) continue;
    w += Math.sin(ph*26) * Math.exp(-d/(cell*5)) * Math.exp(-ph*4.5) * 0.38;
  }
  return w;
}

// çarpma anında: balon kaybolur, yerine boya damlaları ve lastik parçaları saçılır
function spawnBurst(x, y, col, area){
  const n = 14 + Math.round(area*2.2);
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, sp = (60 + Math.random()*260) * (0.7+area*0.06);
    bits.push({ kind:'drop', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60,
                r: cell*(0.07+Math.random()*0.16), c: col, t:0, life: 0.45+Math.random()*0.5 });
  }
  for(let i=0;i<7;i++){                       // patlayan balonun lastik parçaları
    const a = Math.random()*6.283, sp = 120+Math.random()*220;
    bits.push({ kind:'shard', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-120,
                r: cell*0.16, c: col, rot: Math.random()*6.283, vr:(Math.random()-0.5)*18,
                t:0, life: 0.35+Math.random()*0.3 });
  }
  shake = Math.min(9, 2.5 + area*0.5);
}
function updateBits(dt){
  for(let i=bits.length-1;i>=0;i--){
    const p = bits[i];
    p.t += dt;
    if(p.t >= p.life){ bits.splice(i,1); continue; }
    p.vy += 900*dt;                  // yerçekimi
    p.vx *= (1-2.2*dt); p.vy *= (1-0.6*dt);
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.kind==='shard') p.rot += p.vr*dt;
  }
  if(shake > 0) shake = Math.max(0, shake - dt*32);
}
function drawBits(){
  for(const p of bits){
    const k = 1 - p.t/p.life;
    ctx.globalAlpha = Math.min(1, k*1.6);
    if(p.kind==='drop'){
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r*(0.8+k*0.5), p.r*(0.8+k*0.5)*(1+Math.min(1.4,Math.abs(p.vy)/700)),
                  Math.atan2(p.vy,p.vx)-1.57, 0, 6.283);
      ctx.fillStyle = rgbs(p.c); ctx.fill();
    } else {
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = rgbs(p.c);
      ctx.fillRect(-p.r, -p.r*0.45, p.r*2, p.r*0.9);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
let maxPull = 200, maxRange = 600;

// sadece hedef resimde geçen renkler — çözülemez bölüm olmasın
function artColors(art){
  const set = [];
  for(const row of art) for(const ch of row)
    if(ch!=='.' && PAL[ch] && set.indexOf(ch)<0) set.push(ch);
  return set;
}
// balon boyutları: tam kare blokları — yarım kare yok, taşma yok
const MAXB = 4;        // bir balon en fazla 4×4 kare boyar
const SPARE = 0.12;    // parça sayısının bu kadarı fazladan 1×1 balon (hata telafisi)

function makeBalloon(cols, shape){
  const key = cols[(Math.random()*cols.length)|0];
  return { col: hex2rgb(PAL[key]), w: shape.w, h: shape.h };
}

// resmi aynı renkli dikdörtgen parçalara böl (açgözlü: her adımda en geniş alan)
function decompose(art){
  const used = Array.from({length:N}, () => new Array(N).fill(false));
  const parts = [];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const ch = art[y][x];
    if(ch==='.' || used[y][x]) continue;
    const free = (px,py) => py<N && px<N && art[py][px]===ch && !used[py][px];
    let wmax = 0;
    while(wmax<MAXB && free(x+wmax, y)) wmax++;
    let best = {w:1,h:1,a:1};
    for(let w=1; w<=wmax; w++){
      let h = 0;
      while(h<MAXB && y+h<N){
        let ok = true;
        for(let k=0;k<w;k++) if(!free(x+k, y+h)){ ok=false; break; }
        if(!ok) break;
        h++;
      }
      if(w*h > best.a) best = {w, h, a:w*h};
    }
    for(let j=0;j<best.h;j++) for(let i=0;i<best.w;i++) used[y+j][x+i] = true;
    parts.push({ x, y, w:best.w, h:best.h, ch });
  }
  return parts;
}

// deste doğrudan resmin parçalarından kurulur → her balonun tam oturduğu bir yer vardır
function buildDeck(art, cols){
  const parts = decompose(art);
  const out = parts.map(p => ({ col: hex2rgb(PAL[p.ch]), w:p.w, h:p.h }));
  const spare = Math.max(1, Math.round(parts.length * SPARE));
  for(let i=0;i<spare;i++) out.push(makeBalloon(cols, {w:1,h:1}));
  for(let i=out.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}

// bloğun sol-üst kare indeksi (merkez noktadan hizalanır, tuval dışına taşmaz)
function blockOrigin(cx, cy, b, clamp){
  let ox = Math.round((cx-gridX)/cell - b.w/2);
  let oy = Math.round((cy-gridY)/cell - b.h/2);
  if(clamp === false) return [ox, oy];          // duvar kontrolü için ham değer
  ox = Math.max(0, Math.min(N-b.w, ox));
  oy = Math.max(0, Math.min(N-b.h, oy));
  return [ox, oy];
}
// oyun alanı = resmin silüeti; dışarısı duvar
function playable(x, y){ return x>=0 && y>=0 && x<N && y<N && target[y] && !!target[y][x]; }
function fits(ox, oy, b){
  if(ox<0 || oy<0 || ox+b.w>N || oy+b.h>N) return false;
  for(let j=0;j<b.h;j++) for(let i=0;i<b.w;i++) if(!playable(ox+i, oy+j)) return false;
  return true;
}
// oynanabilir alanın yolu (duvar kesiği ve kırpma için)
let areaPath = null;
function buildAreaPath(){
  areaPath = new Path2D();
  for(let y=0;y<N;y++) for(let x=0;x<N;x++)
    if(playable(x,y)) areaPath.rect(gridX+x*cell, gridY+y*cell, cell, cell);
}
// bu atışın boyayacağı kareler — hepsi tam kaplama
function splatCells(cx, cy, b){
  const [ox,oy] = blockOrigin(cx,cy,b), out = [];
  for(let y=oy;y<oy+b.h;y++) for(let x=ox;x<ox+b.w;x++)
    if(playable(x,y)) out.push({x,y,cov:1});     // duvara taşan kısım boyanmaz
  return out;
}

function loadLevel(i){
  level = i % LEVELS.length;
  const L = LEVELS[level];
  target = []; paint = []; splats = [];
  for(let y=0;y<N;y++){
    target.push([]); paint.push([]);
    for(let x=0;x<N;x++){
      const ch = L.art[y][x];
      target[y].push(ch==='.' ? null : hex2rgb(PAL[ch]));
      paint[y].push(null);   // {c:[r,g,b], w:number}
    }
  }
  buildAreaPath();
  L.cols = artColors(L.art);
  deck = buildDeck(L.art, L.cols);
  queue = deck.splice(0, 3);
  ammo = queue.length + deck.length;
  matchPct = 0; drag = null; flying = null; hand = null; bits = []; shocks = []; shake = 0;
  history = []; undoLeft = 3; refreshUndo();
  if(state !== 'menu') state = 'aim';
  $('lvl').textContent = level+1;
  $('goal').textContent = L.goal;
  updateHUD();
  $('msg').style.display = 'none';
}

function updateHUD(){
  $('ammo').textContent = ammo;
  $('ammo').style.color = ammo<=3 ? '#ff6b6b' : ammo<=6 ? '#ffd24a' : '#fff';
  $('match').textContent = matchPct + '%';
}

/* ---------------- boyama ---------------- */
function applySplat(cx, cy, b){
  const color = b.col;
  const cells = splatCells(cx, cy, b);
  // geri alma için etkilenen karelerin eski hali saklanır
  history.push({ b, snap: cells.map(s => {
    const p = paint[s.y][s.x];
    return { x:s.x, y:s.y, prev: p ? { c:p.c.slice(), w:p.w } : null };
  })});
  if(history.length > 24) history.shift();
  for(const s of cells){
    const cur = paint[s.y][s.x];
    if(!cur) paint[s.y][s.x] = { c: color.slice(), w: s.cov, pop: 1 };
    else {
      cur.c = mixPaint(cur.c, cur.w, color, s.cov);
      cur.w = Math.min(3, cur.w + s.cov);
      cur.pop = 1;                       // boyanan kare kısa süre şişip oturur
    }
  }
  computeMatch();
}

function computeMatch(){
  let total = 0, score = 0;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    // duvar hücrelerine boya gidemediği için sadece oyun alanı puanlanır
    const t = target[y][x], p = paint[y][x];
    if(!t) continue;
    total++;
    if(p) score += Math.max(0, 1 - dist2(t,p.c)/170);
  }
  matchPct = Math.round(100*score/total);
  updateHUD();
  refreshUndo();
}

/* ---------------- boyut / yerleşim ---------------- */
function resize(){
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
  wall = Math.max(9, Math.min(W,H)*0.026);
  gridSize = Math.min(W*0.92, H*0.62) - wall*2;
  cell = gridSize/N;
  gridX = (W-gridSize)/2;
  gridY = Math.max(64, H*0.10);
  launchX = W/2;
  launchY = gridY + gridSize + Math.min(110, (H-gridY-gridSize)*0.38);
  // tam germe, fırlatıcının ALTINDA kalan boşluğa sığmalı — yoksa tam menzile parmak yetişmez
  const room = H - launchY - 24;
  maxPull = Math.max(60, Math.min(Math.min(W,H)*0.32, room*0.88));
  maxRange = Math.hypot(gridSize/2 + cell, launchY - gridY + cell);
  if(target.length) buildAreaPath();     // hücre ölçüsü değişti, alan yolu yenilenir
}
window.addEventListener('resize', resize);

/* ---------------- nişan hesabı ---------------- */
const MIN_PULL = 6;     // bu kadar germede atış sayılır
// şeklin olabilecek en geniş yarıçapı (dalgalı kenarın tepe noktası)
function aimPoint(dx, dy, b){
  // sapan: parmağı geriye çekersin, top ters yöne uçar.
  // mesafe eğrisel: tam germeye yaklaştıkça hassaslaşır (tuval oraya denk gelir)
  const pull = Math.hypot(dx,dy);
  if(pull < 0.001) return [launchX, launchY];
  const t = Math.min(1, pull/maxPull);
  const range = maxRange * Math.pow(t, 0.65);
  let tx = launchX - (dx/pull)*range;
  let ty = launchY - (dy/pull)*range;
  // blok kare ızgarasına hizalanır ve tuvalin dışına asla taşmaz
  const [ox,oy] = blockOrigin(tx, ty, b);
  return [ gridX + (ox + b.w/2)*cell, gridY + (oy + b.h/2)*cell ];
}

/* ---------------- girdi ---------------- */
function pos(e){
  const t = e.touches ? e.touches[0] : e;
  const r = cv.getBoundingClientRect();
  return [t.clientX-r.left, t.clientY-r.top];
}
function down(e){
  if(state!=='aim' || flying || hand || ammo<=0) return;
  e.preventDefault();
  const [x,y] = pos(e);
  drag = { sx:x, sy:y, x:x, y:y };
  sfx.pull();
}
function move(e){
  if(!drag) return;
  e.preventDefault();
  const [x,y] = pos(e);
  drag.x = x; drag.y = y;
}
function up(e){
  if(!drag) return;
  e.preventDefault();
  if(mode === 'block'){
    const b = queue[0];
    if(b && drag.y < gridY + gridSize + cell*2){
      const [ox,oy] = blockOrigin(drag.x, drag.y, b, false);
      if(fits(ox,oy,b)) place(ox, oy);
      else sfx.bump();                 // duvara çarptı: blok harcanmaz
    }
    drag = null;
    return;
  }
  const dx = drag.x-drag.sx, dy = drag.y-drag.sy;
  const pull = Math.hypot(dx,dy);
  if(pull > MIN_PULL) shoot(dx,dy);
  drag = null;
}

// blok modu: yapışkan el uzanıp bloğu yerine koyar
function place(ox, oy){
  const b = queue.shift();
  if(deck.length) queue.push(deck.shift());
  ammo--; updateHUD();
  sfx.reach();
  hand = { b, tx: gridX+(ox+b.w/2)*cell, ty: gridY+(oy+b.h/2)*cell, t:0, phase:'out' };
}
function shoot(dx,dy){
  const b = queue.shift();
  if(deck.length) queue.push(deck.shift());
  const [tx,ty] = aimPoint(dx,dy,b);
  sfx.shoot(b.w*b.h);
  ammo--; updateHUD();
  flying = { b, x:launchX, y:launchY, tx, ty, t:0, dur: 0.42 };
}

cv.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false});
cv.addEventListener('touchend',up,{passive:false}); cv.addEventListener('touchcancel',up,{passive:false});

/* ---------------- çizim ---------------- */
function rgbs(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(a===undefined?1:a)+')'; }

function drawGrid(){
  // oyun alanını çevreleyen duvar — bloklar bu kabın dışına konamaz
  const ox = gridX-wall, oy = gridY-wall, os = gridSize+wall*2;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = wall*1.2; ctx.shadowOffsetY = wall*0.35;
  rr(ctx, ox, oy, os, os, wall*1.1);
  ctx.fillStyle = '#3d4455'; ctx.fill();
  ctx.restore();
  // duvarın üst ışığı ve iç gölgesi
  ctx.save();
  rr(ctx, ox, oy, os, os, wall*1.1); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.fillRect(ox, oy, os, wall*0.42);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(ox, oy+os-wall*0.4, os, wall*0.4);
  ctx.restore();
  // köşe perçinleri
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  for(const [cx0,cy0] of [[ox+wall*0.62,oy+wall*0.62],[ox+os-wall*0.62,oy+wall*0.62],
                          [ox+wall*0.62,oy+os-wall*0.62],[ox+os-wall*0.62,oy+os-wall*0.62]]){
    ctx.beginPath(); ctx.arc(cx0, cy0, wall*0.26, 0, 6.283); ctx.fill();
  }
  // iç alan: her yer duvar, sadece resmin silüeti oynanabilir tuval olarak açılır
  ctx.fillStyle = '#4a5265';
  ctx.fillRect(gridX, gridY, gridSize, gridSize);
  if(!areaPath) buildAreaPath();
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = wall*0.8;
  ctx.fillStyle = '#fff'; ctx.fill(areaPath);
  ctx.restore();
  // duvarın oyuğa bakan kenarında ışık
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 3;
  ctx.stroke(areaPath);
  ctx.restore();

  // silik hedef resim
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const t = target[y][x];
    if(!t) continue;
    ctx.fillStyle = rgbs(t, 0.20);
    ctx.fillRect(gridX+x*cell, gridY+y*cell, cell, cell);
  }
  // atılmış boya — şişme animasyonu tuvalin dışına taşmasın
  ctx.save();
  ctx.beginPath(); ctx.rect(gridX, gridY, gridSize, gridSize); ctx.clip();
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const p = paint[y][x];
    if(!p) continue;
    const px0 = gridX+x*cell, py0 = gridY+y*cell;
    // blok modunda her kare bir jöle küpü, boya modunda düz boya
    const put = () => {
      if(mode === 'block') drawCube(px0, py0, cell, p.c, Math.min(1, 0.8 + p.w*0.2));
      else { ctx.fillStyle = rgbs(p.c, Math.min(1, 0.55 + p.w*0.35));
             ctx.fillRect(px0, py0, cell, cell); }
    };
    const base = p.pop > 0 ? 1 + 0.45*p.pop : 1;
    const w = (mode === 'block' && shocks.length) ? jiggle(px0+cell/2, py0+cell/2) : 0;
    if(base !== 1 || w !== 0){
      // jöle: dikey uzarken yatay incelir, alt kenar yere yapışık kalır
      const cx0 = px0+cell/2, by = py0+cell;
      ctx.save();
      ctx.translate(cx0, by);
      ctx.scale(base*(1-w*0.7), base*(1+w));
      ctx.translate(-cx0, -by);
      put();
      ctx.restore();
    } else put();
  }
  ctx.restore();
  // grid çizgileri — sadece oyun alanının içinde
  ctx.save();
  ctx.clip(areaPath);
  ctx.strokeStyle = 'rgba(0,0,0,.09)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    ctx.moveTo(gridX+i*cell+.5, gridY); ctx.lineTo(gridX+i*cell+.5, gridY+gridSize);
    ctx.moveTo(gridX, gridY+i*cell+.5); ctx.lineTo(gridX+gridSize, gridY+i*cell+.5);
  }
  ctx.stroke();
  ctx.restore();
  // alanın dış hattı
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2;
  ctx.stroke(areaPath);
}

// ang: uzun eksenin yöneleceği açı, st: gerilme (1 = normal, >1 uzun-ince)
function drawBalloon(x,y,b,scale,ang,st){
  const sc = scale||1, s = st||1;
  const r = 11*Math.sqrt(b.w*b.h)*sc;
  ctx.save();
  ctx.translate(x,y);
  ctx.save();
  if(ang !== undefined) ctx.rotate(ang + Math.PI/2);   // gövde varsayılan olarak dikey
  ctx.scale(1/Math.sqrt(s), s);                        // gerilirken incelir (hacim korunur hissi)
  // gövde
  ctx.beginPath();
  ctx.moveTo(0, -r*1.15);
  ctx.bezierCurveTo(r*1.15,-r*1.15, r*1.05, r*0.75, 0, r*1.2);
  ctx.bezierCurveTo(-r*1.05, r*0.75, -r*1.15,-r*1.15, 0,-r*1.15);
  ctx.fillStyle = rgbs(b.col);
  ctx.fill();
  // uç düğümü
  ctx.beginPath();
  ctx.moveTo(-r*0.16, r*1.16); ctx.lineTo(r*0.16, r*1.16); ctx.lineTo(0, r*1.42);
  ctx.closePath(); ctx.fill();
  // parlama
  ctx.beginPath(); ctx.ellipse(-r*0.32,-r*0.35, r*0.26, r*0.42, -0.5, 0, 6.3);
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
  ctx.restore();
  // kaç kare boyayacağı yazar — gerilmeden etkilenmez
  const lum = (b.col[0]*0.3+b.col[1]*0.6+b.col[2]*0.1);
  ctx.fillStyle = lum>150 ? 'rgba(0,0,0,.65)' : 'rgba(255,255,255,.9)';
  ctx.font = 'bold '+Math.max(8, r*0.6)+'px system-ui';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(b.w+'×'+b.h, 0, 0);
  ctx.restore();
}

// tuvale konacak blok — balonun blok modundaki karşılığı
function drawBlockPiece(x, y, b, scale){
  const s = scale||1, w = b.w*cell*s, h = b.h*cell*s;
  ctx.save();
  ctx.translate(x-w/2, y-h/2);
  ctx.fillStyle = 'rgba(0,0,0,.3)';               // gölge
  rr(ctx, 4, 6, w, h, cell*s*0.16); ctx.fill();
  // her 1×1 ayrı jöle küpü, birleşip bloğu oluşturur
  const u = cell*s;
  for(let j=0;j<b.h;j++) for(let i=0;i<b.w;i++) drawCube(i*u, j*u, u, b.col);
  // ölçü etiketi küpleri boğmasın: küçük, yarı saydam bir rozet
  const fs = Math.max(9, Math.min(22, cell*s*0.62));
  if(w < fs*2.6 || h < fs*1.6){ ctx.restore(); return; }   // küçük blokta rozet sığmaz
  ctx.font = 'bold '+fs+'px system-ui';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const label = b.w+'×'+b.h, tw = ctx.measureText(label).width;
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  rr(ctx, w/2-tw/2-6, h/2-fs*0.7, tw+12, fs*1.4, fs*0.7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.fillText(label, w/2, h/2);
  ctx.restore();
}

// uzayan yapışkan el: kol + tutucu, ucunda bloğu taşır
function drawHand(){
  if(!hand) return;
  const e = hand.phase==='out' ? 1-Math.pow(1-hand.t, 3) : hand.t;   // gidişte yavaşlayarak varır
  const hx = launchX + (hand.tx-launchX)*e;
  const hy = launchY + (hand.ty-launchY)*e;
  const ang = Math.atan2(hy-launchY, hx-launchX);
  const len = Math.hypot(hx-launchX, hy-launchY);
  ctx.save();
  ctx.translate(launchX, launchY); ctx.rotate(ang);
  // kol — uzadıkça incelir (lastik hissi)
  const th = Math.max(7, 18 - len*0.013);
  const gr = ctx.createLinearGradient(0,-th/2,0,th/2);
  gr.addColorStop(0,'#ffe3c8'); gr.addColorStop(1,'#e0a878');
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(0,-th/2,len,th,th/2) : ctx.rect(0,-th/2,len,th);
  ctx.fillStyle = gr; ctx.fill();
  ctx.strokeStyle = 'rgba(60,30,10,.35)'; ctx.lineWidth = 2; ctx.stroke();
  // tutucu el
  ctx.translate(len, 0);
  ctx.beginPath(); ctx.arc(0,0, th*1.3, 0, 6.283);
  ctx.fillStyle = '#ffe3c8'; ctx.fill();
  ctx.strokeStyle = 'rgba(60,30,10,.35)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(-th*0.3,-th*0.35, th*0.45, 0, 6.283);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();
  ctx.restore();
  if(hand.phase==='out') drawBlockPiece(hx, hy, hand.b, 1);   // blok elin ucunda
}

function drawPreview(){
  if(!drag) return;
  const b = queue[0];
  if(!b) return;

  if(mode === 'block'){
    if(drag.y > gridY + gridSize + cell*2) return;
    const [ox,oy] = blockOrigin(drag.x, drag.y, b, false);
    const ok = fits(ox, oy, b);
    const tx = gridX+(ox+b.w/2)*cell, ty = gridY+(oy+b.h/2)*cell;
    ctx.save();
    if(ok){
      ctx.setLineDash([5,5]); ctx.lineWidth = 2;        // elin uzanacağı yol
      ctx.strokeStyle = 'rgba(255,255,255,.22)';
      ctx.beginPath(); ctx.moveTo(launchX,launchY); ctx.lineTo(tx,ty); ctx.stroke();
      ctx.setLineDash([]);
      for(let j=0;j<b.h;j++) for(let i=0;i<b.w;i++){
        ctx.fillStyle = rgbs(b.col, .45);
        ctx.fillRect(gridX+(ox+i)*cell, gridY+(oy+j)*cell, cell, cell);
      }
      ctx.lineWidth = 2.5; ctx.setLineDash([6,5]);
      ctx.strokeStyle = rgbs(b.col, .95);
    } else {
      // duvara taşıyor: geçersiz, buraya konamaz
      ctx.fillStyle = 'rgba(255,70,70,.18)';
      ctx.fillRect(gridX+ox*cell, gridY+oy*cell, b.w*cell, b.h*cell);
      ctx.lineWidth = 3; ctx.setLineDash([7,5]);
      ctx.strokeStyle = 'rgba(255,80,80,.95)';
    }
    ctx.strokeRect(gridX+ox*cell, gridY+oy*cell, b.w*cell, b.h*cell);
    ctx.restore();
    return;
  }

  const dx = drag.x-drag.sx, dy = drag.y-drag.sy;
  if(Math.hypot(dx,dy) < MIN_PULL) return;
  const [tx,ty] = aimPoint(dx,dy,b);

  // yörünge noktaları
  ctx.save();
  for(let i=1;i<=9;i++){
    const t=i/10;
    const x = launchX + (tx-launchX)*t;
    const y = launchY + (ty-launchY)*t - Math.sin(t*Math.PI)*70;
    ctx.beginPath(); ctx.arc(x,y, 3.2-t*1.4, 0, 6.3);
    ctx.fillStyle = rgbs(b.col, 0.25+t*0.45); ctx.fill();
  }
  // boyanacak kareler — atışta boyanacak olanın birebir aynısı
  for(const s of splatCells(tx, ty, b)){
    ctx.fillStyle = rgbs(b.col, .45);
    ctx.fillRect(gridX+s.x*cell, gridY+s.y*cell, cell, cell);
  }
  // blok çerçevesi
  const [ox,oy] = blockOrigin(tx,ty,b);
  ctx.lineWidth = 2.5; ctx.setLineDash([6,5]);
  ctx.strokeStyle = rgbs(b.col, .95);
  ctx.strokeRect(gridX+ox*cell, gridY+oy*cell, b.w*cell, b.h*cell);
  ctx.setLineDash([]);
  // germe lastiği
  ctx.beginPath(); ctx.moveTo(launchX,launchY);
  ctx.lineTo(launchX-dx*0.5, launchY-dy*0.5);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
}

function drawQueue(){
  const y = launchY;
  if(mode === 'block'){
    drawBlockPiece(launchX, y, queue[0], 1);
    const b3 = W - 30 - cell*0.9, bx = b3 - cell*2.8;
    ctx.save();
    ctx.font = '11px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.textAlign='center';
    ctx.fillText('SIRADAKİ', (bx+b3)/2, y - cell*1.9);
    ctx.restore();
    if(queue[1]) drawBlockPiece(bx, y, queue[1], 0.55);
    if(queue[2]) drawBlockPiece(b3, y, queue[2], 0.42);
    return;
  }
  // gerdikçe balon lastikte geri kayar ve atış yönünde uzun-ince forma girer
  let bxc = launchX, byc = y, ang, st = 1;
  if(drag){
    const dx = drag.x-drag.sx, dy = drag.y-drag.sy, pull = Math.hypot(dx,dy);
    if(pull > MIN_PULL){
      const k = Math.min(1, pull/maxPull);
      const back = Math.min(pull*0.4, 46);
      bxc = launchX + (dx/pull)*back;
      byc = y + (dy/pull)*back;
      ang = Math.atan2(-dy, -dx);          // uzun eksen atış yönünde
      st = 1 + 0.75*k;
    }
  }
  drawBalloon(bxc, byc, queue[0], 1.25, ang, st);
  // sıradaki iki balon — dar ekranda taşmaması için sağ kenardan hizalanır
  const b3 = W - 34, bx = b3 - 46;
  ctx.save();
  ctx.font = '11px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.textAlign='center';
  ctx.fillText('SIRADAKİ', (bx+b3)/2, y-46);
  ctx.restore();
  if(queue[1]) drawBalloon(bx, y, queue[1], 0.8);
  if(queue[2]) drawBalloon(b3, y, queue[2], 0.6);
  // fırlatma kaidesi
  ctx.beginPath(); ctx.ellipse(launchX, launchY+26, 34, 9, 0,0,6.3);
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fill();
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  ctx.clearRect(0,0,W,H);

  // arka plan
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#252a33'); g.addColorStop(1,'#14161b');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  updateBits(dt);
  for(let i=shocks.length-1;i>=0;i--){          // sarsıntı dalgası ilerler ve söner
    shocks[i].t += dt;
    if(shocks[i].t > 1.4) shocks.splice(i,1);
  }
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){     // kare pop'unu söndür
    const p = paint[y][x];
    if(p && p.pop > 0) p.pop = Math.max(0, p.pop - dt*5);
  }

  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  drawGrid();

  // uçan balon
  if(flying){
    flying.t += dt/flying.dur;
    const t = Math.min(1, flying.t);
    const x = flying.x + (flying.tx-flying.x)*t;
    const y = flying.y + (flying.ty-flying.y)*t - Math.sin(t*Math.PI)*90;
    // bir önceki kareye göre hız yönü → balon uçuş boyunca o yöne uzanır
    const pt = Math.max(0, t-0.04);
    const px = flying.x + (flying.tx-flying.x)*pt;
    const py = flying.y + (flying.ty-flying.y)*pt - Math.sin(pt*Math.PI)*90;
    const ang = Math.atan2(y-py, x-px);
    drawBalloon(x, y, flying.b, 1 + t*0.45, ang, 1.45 - t*0.25);
    if(t>=1){
      const before = flying.b.w * flying.b.h;
      const over = splatCells(flying.tx, flying.ty, flying.b).filter(s => paint[s.y][s.x]).length;
      sfx.splat(before);
      if(over) sfx.mix();                       // üstüne bindiyse renk karışma sesi
      applySplat(flying.tx, flying.ty, flying.b);
      spawnBurst(flying.tx, flying.ty, flying.b.col, before);
      splats.push({x:flying.tx, y:flying.ty, c:flying.b.col, r:Math.max(flying.b.w, flying.b.h)*cell*0.5, t:0});
      flying = null;
      if(ammo<=0) setTimeout(finish, 500);
    }
  }

  // sıçrama efekti
  for(let i=splats.length-1;i>=0;i--){
    const s = splats[i]; s.t += dt*3;
    if(s.t>=1){ splats.splice(i,1); continue; }
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r*(1+s.t*0.8), 0, 6.3);
    ctx.strokeStyle = rgbs(s.c, (1-s.t)*0.8); ctx.lineWidth = 4*(1-s.t); ctx.stroke();
  }

  // uzayan el (blok modu)
  if(hand){
    if(hand.phase === 'out'){
      hand.t += dt/0.30;
      if(hand.t >= 1){
        hand.t = 1;
        const b = hand.b;
        const over = splatCells(hand.tx, hand.ty, b).filter(s => paint[s.y][s.x]).length;
        sfx.stick();
        if(over) sfx.mix();
        applySplat(hand.tx, hand.ty, b);
        shocks.push({ x: hand.tx, y: hand.ty, t: 0 });
        if(shocks.length > 3) shocks.shift();
        shake = Math.min(6, 1.5 + b.w*b.h*0.25);
        hand.phase = 'back';
      }
    } else {
      hand.t -= dt/0.22;
      if(hand.t <= 0){
        hand = null;
        if(ammo <= 0) setTimeout(finish, 400);
      }
    }
    drawHand();
  }

  if(state==='aim' && !flying && !hand && ammo>0){ drawQueue(); drawPreview(); }

  drawBits();
  ctx.restore();

  requestAnimationFrame(loop);
}

function finish(){
  const L = LEVELS[level];
  const win = matchPct >= L.goal;
  state = 'over';
  refreshUndo();
  win ? sfx.win() : sfx.lose();
  $('mt').textContent = win ? 'Harika! 🎨' : 'Olmadı…';
  $('ms').textContent = L.name + ' — eşleşme %' + matchPct + ' (hedef %' + L.goal + ')';
  $('mb').textContent = win ? 'Sonraki Bölüm' : 'Tekrar Dene';
  $('mb').onclick = () => loadLevel(win ? level+1 : level);
  $('msg').style.display = 'flex';
}

// test: her parçayı doğru yerine koyarsa oyun %100'e ulaşıyor mu?
function solve(){
  for(const p of decompose(LEVELS[level].art))
    for(let j=0;j<p.h;j++) for(let i=0;i<p.w;i++)
      paint[p.y+j][p.x+i] = { c: hex2rgb(PAL[p.ch]), w: 1 };
  computeMatch();
  return matchPct;
}
window.PB = { loadLevel, solve, levels: LEVELS, parts: () => decompose(LEVELS[level].art),
              aim: (dx,dy) => { drag = { sx:launchX, sy:launchY, x:launchX+dx, y:launchY+dy }; },
              fire: () => up({ preventDefault(){} }),
              bits: () => bits.length,
              mix: (a,wa,b,wb) => mixPaint(a,wa,b,wb).map(v=>Math.round(v)),
              cellAt: (x,y) => paint[y][x] && { renk: paint[y][x].c.map(v=>Math.round(v)), kat: +paint[y][x].w.toFixed(2) },
              wave: (dx,dy) => { const s = shocks[shocks.length-1];
                                 return s ? jiggle(s.x+dx*cell, s.y+dy*cell) : 0; },
              info: () => ({ H, launchY, altBosluk: Math.round(H-launchY), maxPull: Math.round(maxPull) }) };
function startGame(m){
  mode = m;
  $('start').style.display = 'none';
  state = 'aim';
  audio();                       // ilk dokunuşta ses açılır (mobil kısıtı)
  loadLevel(0);
}
$('mPaint').addEventListener('click', () => startGame('paint'));
$('mBlock').addEventListener('click', () => startGame('block'));
$('mm').addEventListener('click', () => {
  $('msg').style.display = 'none';
  $('start').style.display = 'flex';
  state = 'menu';
});

$('undo').addEventListener('click', e => { e.stopPropagation(); undo(); });

$('snd').addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  $('snd').textContent = muted ? '🔇' : '🔊';
  $('snd').classList.toggle('off', muted);
  if(!muted) sfx.pull();
});

resize();
loadLevel(0);
requestAnimationFrame(loop);
})();
</script>
